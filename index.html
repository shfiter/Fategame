<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賽事身分驗證系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 狀態一：未登入畫面 -->
        <div id="view-login" class="view-section">
            <h1>🔐 身分驗證</h1>
            <p>請先使用 LINE 帳號登入系統</p>
            <button id="line-login-btn" class="line-btn">
                使用 LINE 帳號登入
            </button>
        </div>

        <!-- 狀態二：驗證處理中 -->
        <div id="view-loading" class="view-section hidden">
            <h2>正在取得 LINE 身分，請稍候...</h2>
        </div>

        <!-- 狀態三：登入成功，顯示 LINE 資訊 -->
        <div id="view-profile" class="view-section hidden">
            <h2>🎉 登入成功！</h2>
            <div class="profile-card">
                <p><strong>LINE 名稱：</strong><span id="display-name">載入中...</span></p>
                <p><strong>LINE UID：</strong><span id="display-uid">載入中...</span></p>
            </div>
            <p class="tip-text">您的身分已成功與系統綁定。</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
